# Builds Lumio's image (the web app and its server in one) and publishes it to the GitHub Container Registry:
#   ghcr.io/<owner>/lumio:latest   from main
#   ghcr.io/<owner>/lumio:1.2.3    from a tag v1.2.3 (also 1.2)
# The image is built to sit in front of Jellyfin (VITE_JELLYFIN_URL=/: Jellyfin is found on the address Lumio is opened
# on), so it works under any domain. It holds no keys for outside services: whoever runs it sets their own on the
# container (LASTFM_API_KEY, TICKETMASTER_API_KEY, TMDB_API_KEY), and the app asks those services through its server.
name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/lumio
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_JELLYFIN_URL=/
            VITE_SERVER_LOCKED=true
          # Layers are cached in the Actions cache, not the registry (keeps package storage small).
          cache-from: type=gha
          cache-to: type=gha,mode=max
