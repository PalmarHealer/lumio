# Lumio in front of Jellyfin: Lumio is the only public face (the app, plus Jellyfin's API, WebSockets and its
# administration passed through); Jellyfin itself is reachable inside the stack only.
# Point your reverse proxy (TLS) at lumio:8097 instead of jellyfin:8096. See docs/SETUP.md.

services:
  lumio:
    image: ghcr.io/palmarhealer/lumio:latest
    container_name: lumio
    restart: unless-stopped
    depends_on:
      - jellyfin
    environment:
      # Jellyfin inside the stack (not its public address).
      JELLYFIN_URL: http://jellyfin:8096
      # Pass everything of Jellyfin's through (API, WebSockets, /web for the administration, /sso).
      PROXY_JELLYFIN: "true"
      # Optional: buttons on the sign-in page for the Jellyfin SSO plugin's providers ("name:Label", comma-separated).
      # SSO_PROVIDERS: "authentik:Sign in with Authentik"
      # Optional, with SSO: no Jellyfin password form on the sign-in page (SSO and Quick Connect only).
      # DISABLE_PASSWORD_LOGIN: "true"
      # Recommended: how MusicBrainz can reach you (it throttles anonymous clients).
      MUSICBRAINZ_CONTACT: "admin@example.org"
      # Optional, your own free keys (the image has none): Last.fm (listeners, bios, similar artists, charts),
      # Ticketmaster (concerts), TMDb (ratings, film series names). Without one, what it brings stays off.
      # LASTFM_API_KEY: ""
      # TICKETMASTER_API_KEY: ""
      # TMDB_API_KEY: ""
      # Optional: finding songs by their lyrics, in the Meilisearch the Jellyfin plugin uses (a key for Lumio's index
      # only, see docs/SETUP.md).
      # MEILI_URL: http://meilisearch:7700
      # MEILI_KEY: ""
      # Optional, for the editor's stems ("Mix-Modus"): the address stem workers reach this server at, put into the join
      # keys you create in Lumio's settings (Administration -> Stem-Worker; it can be changed there too). Use an IP if
      # the worker's containers can't resolve the name (e.g. a Tailscale IP: http://100.x.y.z:8097/api).
      # STEMS_WORKER_URL: ""
    volumes:
      - lumio-data:/data
    # Only your reverse proxy needs to reach it; publish the port only without one.
    # ports:
    #   - "8097:8097"

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      # The address people use: Lumio's.
      JELLYFIN_PublishedServerUrl: https://media.example.org
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /path/to/media:/media:ro
    # No ports: only Lumio talks to Jellyfin.

  # Optional: separates songs into stems for the editor on this server's CPU, as a fallback (windows only, low
  # priority, one at a time; it pauses while a stronger primary worker elsewhere is connected). Off unless you enable
  # it (docker compose --profile stems up). Add a worker with the role "fallback" in Lumio's settings (Stem-Worker)
  # and paste its join key below (for this one the address in the key may be http://lumio:8097/api); the HTDemucs
  # ONNX model goes into ./stems-model.
  # stem-worker:
  #   image: ghcr.io/palmarhealer/lumio-stem-worker:latest
  #   profiles: [stems]
  #   restart: unless-stopped
  #   depends_on:
  #     - lumio
  #   environment:
  #     LUMIO_JOIN_KEY: ""
  #     NICE: "19"
  #     THREADS: "2"
  #   cpus: 2
  #   volumes:
  #     - ./stems-model:/models:ro

volumes:
  lumio-data:
