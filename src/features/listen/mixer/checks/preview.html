<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Preview check</title>
  </head>
  <body>
    <pre id="out">running…</pre>
    <script type="module">
      import { checkPreview } from './preview-check.ts'
      const result = await checkPreview()
      window.previewResult = result
      document.getElementById('out').textContent = JSON.stringify(result, null, 1) + (result.pass ? '\nPASS' : '\nFAIL')
      window.previewDone = true
    </script>
  </body>
</html>
