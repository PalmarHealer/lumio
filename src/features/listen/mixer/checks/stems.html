<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stems check</title>
  </head>
  <body>
    <pre id="out">running…</pre>
    <script type="module">
      import { checkStems } from './stems-check.ts'
      const result = await checkStems()
      window.stemsResult = result
      document.getElementById('out').textContent = JSON.stringify(result, null, 1) + (result.pass ? '\nPASS' : '\nFAIL')
      window.stemsDone = true
    </script>
  </body>
</html>
